name: voxvec

services:
  minecraft:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      TYPE: VANILLA
      VERSION: "26.2"
      LEVEL_TYPE: minecraft:flat
      GENERATOR_SETTINGS: '{"layers":[{"block":"minecraft:air","height":1}],"biome":"minecraft:the_void"}'
      GENERATE_STRUCTURES: "false"
      MEMORY: 1G
      UID: ${UID:-1000}
      GID: ${GID:-1000}
    volumes:
      - server:/data
      - ${VOXVEC_WORLD:?}:/data/world
    healthcheck:
      test: mc-health
      start_period: 5m
      start_interval: 1s
    stop_grace_period: 1m

volumes:
  server:
